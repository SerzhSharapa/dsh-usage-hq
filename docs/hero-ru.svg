<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" font-family="monospace">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a9eda"/>
    </marker>
  </defs>
  <rect width="780" height="200" fill="#fafbfc" rx="12"/>

  <!-- Left character: developer checking subscription limits -->
  <g transform="translate(60,66)">
    <rect x="14" y="0" width="28" height="7" fill="#8B5E3C"/>
    <rect x="7" y="7" width="42" height="7" fill="#8B5E3C"/>
    <rect x="7" y="14" width="42" height="7" fill="#FFDAB9"/>
    <rect x="14" y="21" width="7" height="7" fill="#FFDAB9"/>
    <rect x="35" y="21" width="7" height="7" fill="#FFDAB9"/>
    <rect x="14" y="21" width="7" height="7" fill="#333"/>
    <rect x="35" y="21" width="7" height="7" fill="#333"/>
    <rect x="21" y="28" width="14" height="7" fill="#D4956A"/>
    <rect x="0" y="35" width="56" height="14" fill="#4A9EDA"/>
    <rect x="0" y="49" width="56" height="7" fill="#4A9EDA"/>
    <rect x="7" y="56" width="14" height="7" fill="#444"/>
    <rect x="35" y="56" width="14" height="7" fill="#444"/>
